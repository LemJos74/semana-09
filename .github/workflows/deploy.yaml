name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.build-publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - id: build-publish
        uses: bitovi/github-actions-angular-to-github-pages@v1.0.0
        with:
          checkout: false
          install_command: 'echo deps already installed in a previous step'
          build_command: 'npm run build -- --base-href=/semana-09/ && B=dist/semana-09/browser && if [ -f "$B/index.csr.html" ] && [ ! -f "$B/index.html" ]; then mv "$B/index.csr.html" "$B/index.html"; fi && cp "$B/index.html" "$B/404.html"'
